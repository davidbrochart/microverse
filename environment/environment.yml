name: my-env
channels:
  - https://repo.prefix.dev/emscripten-forge-4x
  - https://repo.prefix.dev/conda-forge
dependencies:
  # server dependencies:
  - pyjs
  - httpx2 >=2.9.1
  - httpx2-jsfetch
  - wsproto
  - jupyverse-api >=0.15.2
  - fps-frontend >=0.10.1
  - fps-lab >=0.11.5
  - fps-jupyterlab >=0.11.3
  - fps-noauth >=0.10.1
  - fps-contents >=0.11.3
  - fps-kernels >=0.11.4
  - fps-akernel-task >=0.2.2
  - fps-kernel-web-worker >=0.2.1
  - fps-file-id >=0.4.3
  - fps-file-watcher-poll >=0.2.1
  - fps-yjs >=0.14.2
  - fps-yrooms >=0.2.3
  - fps-ystore-sqlite >=0.2.2
  - jupyter-collaboration-ui >=2.4.1
  - jupyter-docprovider >=2.4.1

  # kernel dependencies:
  - numpy
  - pandas
  - pydro
